<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="_NnJK5cFiwKJmHzvBCx2DVTX4YJSMU4raqernVgt2cA" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roland Decker | Anaesthesia Registrar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uswds/uswds@3.13.0/dist/css/uswds.min.css">
  <style>
    :root {
      --decker-teal: #008E9B;
      --decker-teal-dark: #006975;
      --decker-teal-light: #e6f6f7;
      --decker-gold: #C9A227;
      --decker-navy: #0d2137;
    }
    html { scroll-behavior: smooth; }
    /* ---- HEADER ---- */
    .decker-header {
      background: var(--decker-navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .decker-logo {
      font-family: 'Georgia', serif;
      font-size: 1.15rem;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .decker-logo span { color: var(--decker-gold); }
    .decker-nav { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; }
    .decker-nav a { color: #c0d8e0; text-decoration: none; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.04em; transition: color 0.15s; }
    .decker-nav a:hover { color: #fff; }
    .decker-nav a.accent { color: var(--decker-gold); }
    @media (max-width: 640px) { .decker-nav { display: none; } }
    /* ---- HERO ---- */
    .decker-hero {
      background: linear-gradient(140deg, var(--decker-navy) 0%, #0a3a52 55%, #005f6a 100%);
      padding: 5.5rem 0 4.5rem;
      position: relative;
      overflow: hidden;
    }
    .decker-hero::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 450px; height: 450px;
      border-radius: 50%;
      background: rgba(0,142,155,0.1);
    }
    .decker-hero::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 360px; height: 360px;
      border-radius: 50%;
      background: rgba(201,162,39,0.07);
    }
    .decker-hero h1 {
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 2.8rem;
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }
    .hero-eyebrow {
      color: var(--decker-gold);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .decker-hero p.lead {
      color: #b8d4dc;
      font-size: 1.08rem;
      line-height: 1.75;
      max-width: 600px;
      margin: 1.2rem 0 2rem;
    }
    .tag-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
    .tag {
      background: rgba(0,142,155,0.22);
      border: 1px solid rgba(0,142,155,0.5);
      color: #9bd6de;
      font-size: 0.75rem;
      padding: 0.28rem 0.8rem;
      border-radius: 2rem;
      letter-spacing: 0.05em;
    }
    .cta-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn-primary {
      background: var(--decker-teal);
      color: #fff;
      padding: 0.75rem 1.8rem;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 3px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--decker-teal-dark); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.4);
      padding: 0.72rem 1.8rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 3px;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .btn-ghost:hover { border-color: #fff; color: #fff; }
    /* ---- SECTION COMMON ---- */
    .sec { padding: 5rem 0; }
    .sec-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--decker-teal);
      margin-bottom: 0.35rem;
    }
    .sec-title {
      font-family: 'Georgia', serif;
      font-size: 1.9rem;
      color: var(--decker-navy);
      margin-bottom: 0.5rem;
    }
    .sec-rule {
      width: 44px;
      height: 3px;
      background: var(--decker-gold);
      margin-bottom: 2rem;
    }
    /* ---- ABOUT ---- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-top: 1rem;
    }
    @media (max-width: 768px) { .about-grid { grid-template-columns: 1fr; } }
    .about-text p { font-size: 1rem; line-height: 1.82; color: #333; margin-bottom: 1rem; }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .stat-card {
      border-left: 4px solid var(--decker-teal);
      background: var(--decker-teal-light);
      padding: 0.9rem 1.1rem;
      border-radius: 2px;
    }
    .stat-num { font-size: 1.9rem; font-weight: 800; color: var(--decker-teal-dark); line-height: 1; }
    .stat-lbl { font-size: 0.78rem; color: #4a5568; margin-top: 0.2rem; }
    /* ---- PROJECTS ---- */
    .projects-bg { background: #f5fafb; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(285px, 1fr));
      gap: 1.4rem;
      margin-top: 1rem;
    }
    .card {
      background: #fff;
      border-top: 4px solid var(--decker-teal);
      border-radius: 3px;
      padding: 1.5rem;
      box-shadow: 0 1px 5px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover { box-shadow: 0 5px 20px rgba(0,142,155,0.14); transform: translateY(-3px); }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.15rem 0.6rem;
      border-radius: 2rem;
      margin-bottom: 0.6rem;
    }
    .b-active { background: #d1f2e0; color: #1a6b3c; }
    .b-dev { background: #fff3cd; color: #7d5a00; }
    .b-live { background: #d0e8ff; color: #00407d; }
    .b-concept{ background: #eae4f5; color: #4a2d88; }
    .card-icon { font-size: 1.7rem; margin-bottom: 0.7rem; }
    .card h3 { font-size: 1rem; font-weight: 700; color: var(--decker-navy); margin-bottom: 0.45rem; }
    .card p { font-size: 0.875rem; color: #505a68; line-height: 1.65; }
    .card-link { display: inline-block; margin-top: 0.9rem; font-size: 0.82rem; font-weight: 700; color: var(--decker-teal); text-decoration: none; }
    .card-link:hover { color: var(--decker-teal-dark); text-decoration: underline; }
    /* ---- CREDENTIALS ---- */
    .cred-bg { background: var(--decker-navy); }
    .cred-bg .sec-label { color: var(--decker-gold); }
    .cred-bg .sec-title { color: #fff; }
    .cred-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.1rem;
      margin-top: 1rem;
    }
    .cred-item {
      border-left: 3px solid var(--decker-teal);
      background: rgba(255,255,255,0.055);
      padding: 1rem 1.2rem;
      border-radius: 2px;
    }
    .cred-title { font-weight: 700; color: #fff; font-size: 0.95rem; margin-bottom: 0.25rem; }
    .cred-body { font-size: 0.84rem; color: #7ab0bf; line-height: 1.6; }
    /* ---- CONTACT ---- */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-top: 1rem;
    }
    @media (max-width: 640px) { .contact-grid { grid-template-columns: 1fr; } }
    .contact-info p { font-size: 0.95rem; color: #4a5568; line-height: 1.78; margin-bottom: 0.75rem; }
    .contact-info a { color: var(--decker-teal); font-weight: 600; text-decoration: none; }
    .contact-info a:hover { text-decoration: underline; }
    .info-box {
      background: var(--decker-teal-light);
      border-left: 4px solid var(--decker-teal);
      padding: 1.3rem 1.4rem;
      border-radius: 3px;
      font-size: 0.9rem;
      line-height: 1.75;
      color: #2d4a55;
    }
    .info-box strong { color: var(--decker-navy); }
    .usa-alert--teal {
      border-left-color: var(--decker-teal) !important;
      margin-bottom: 1.2rem;
    }
    /* ---- FOOTER ---- */
    .decker-footer {
      background: var(--decker-navy);
      padding: 2rem 0;
      text-align: center;
    }
    .decker-footer p { color: #5a7e90; font-size: 0.8rem; margin: 0.2rem 0; }
    .decker-footer a { color: var(--decker-teal); text-decoration: none; }
  </style>
</head>
<body>
<!-- HEADER -->
<header class="decker-header">
  <div class="decker-logo">Roland Decker <span>MD</span></div>
  <nav>
    <ul class="decker-nav">
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
